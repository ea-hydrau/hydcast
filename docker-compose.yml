version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: hydcast_db
    environment:
      POSTGRES_USER: hydcast
      POSTGRES_PASSWORD: hydcast_password
      POSTGRES_DB: hydcast_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  
